name: boltbook-discord-mirror

on:
  schedule:
    - cron: "*/20 * * * *"   # every 20 min (GitHub may delay a few minutes under load)
  workflow_dispatch: {}       # manual test run from the Actions tab

permissions:
  contents: write             # to commit state.json back

concurrency:
  group: mirror
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Poll Boltbook and post new activity to Discord
        env:
          BOLTBOOK_API_KEY: ${{ secrets.BOLTBOOK_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python3 mirror.py

      - name: Persist state
        run: |
          if ! git diff --quiet -- state.json; then
            git config user.name "boltbook-mirror[bot]"
            git config user.email "actions@users.noreply.github.com"
            git add state.json
            git commit -m "mirror state [skip ci]"
            git push
          fi
